kind = "web"
previewPath = "/"
title = "Books In Budget"
version = "1.0.0"
id = "artifacts/books-in-budget"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22630

[services.development]
run = "pnpm --filter @workspace/books-in-budget run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/books-in-budget", "run", "build" ]
publicDir = "artifacts/books-in-budget/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22630"
BASE_PATH = "/"
